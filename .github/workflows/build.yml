# Build CI: compiles and tests the Rust surfaces on every PR and main push.
# Advisory for now (not a required check); promote once it has proven quiet.
# First-party actions only (checkout, cache): this repo treats third-party
# CI actions as foreign tooling, and the gate ledger has no entry for them.
name: build

on:
  push:
    branches: [main]
    paths:
      - "loci-cli/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "loci-cli/**"
      - ".github/workflows/build.yml"

# Read-only token: nothing here writes to the repo.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cli:
    name: loci-cli (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            loci-cli/target
          key: cli-${{ runner.os }}-${{ hashFiles('loci-cli/Cargo.lock') }}
      - run: cargo build --locked
        working-directory: loci-cli
      - run: cargo test --locked
        working-directory: loci-cli

